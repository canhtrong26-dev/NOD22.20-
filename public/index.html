<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Quản lý sản phẩm</h2>
    <div class="flex gap-3">
      <button class="admin-only hidden bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700 font-semibold" onclick="openModal()">+ Thêm sản phẩm</button>
      <button class="bg-gray-500 text-white px-5 py-2 rounded hover:bg-gray-600" onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <!-- Thông báo -->
  <div class="hidden mb-4 p-3 rounded" id="message"></div>

  <!-- Bảng sản phẩm -->
  <table class="w-full bg-white rounded shadow overflow-hidden">
    <thead>
      <tr class="bg-blue-600 text-white">
        <th class="p-3 text-left">ID</th>
        <th class="p-3 text-left">Tên sản phẩm</th>
        <th class="p-3 text-left">Giá</th>
        <th class="p-3 text-left admin-only hidden">Hành động</th>
      </tr>
    </thead>
    <tbody id="productList"></tbody>
  </table>

  <!-- Modal thêm/sửa -->
  <div class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center" id="modal">
    <div class="bg-white p-8 rounded-lg w-96">
      <h3 class="text-xl font-bold mb-4" id="modalTitle">Thêm sản phẩm</h3>
      <input type="hidden" id="productId">
      <input type="text" id="productName" placeholder="Tên sản phẩm"
        class="w-full p-3 mb-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
      <input type="number" id="productPrice" placeholder="Giá"
        class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
      <button class="w-full p-3 bg-green-600 text-white rounded hover:bg-green-700 font-semibold" onclick="saveProduct()">Lưu</button>
      <button class="w-full p-3 bg-gray-500 text-white rounded hover:bg-gray-600 mt-2" onclick="closeModal()">Hủy</button>
    </div>
  </div>

  <script>
    const token = sessionStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    }

    let userRole = '';

    // HÀM TỰ TẠO — gọi API với token
    async function fetchWithAuth(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      };
      const res = await fetch(url, options);
      if (res.status === 401) {
        sessionStorage.removeItem('token');
        window.location.href = '/login.html';
      }
      return res;
    }

    // HÀM TỰ TẠO — hiển thị thông báo
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = type === 'success'
        ? 'mb-4 p-3 rounded bg-green-100 text-green-700'
        : 'mb-4 p-3 rounded bg-red-100 text-red-700';
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 3000);
    }

    // HÀM TỰ TẠO — lấy danh sách sản phẩm
    async function loadProducts() {
      try {
        const res = await fetchWithAuth('/api/v1/products');
        const data = await res.json();

        if (res.ok) {
          const list = document.getElementById('productList');
          list.innerHTML = data.map(p => `
            <tr class="border-b hover:bg-gray-50">
              <td class="p-3">${p.id}</td>
              <td class="p-3">${p.name}</td>
              <td class="p-3">${p.price.toLocaleString()}</td>
              <td class="p-3 ${userRole === 'Admin' ? '' : 'hidden'}">
                <button class="bg-yellow-400 text-black px-3 py-1 rounded hover:bg-yellow-500 mr-1" onclick="editProduct(${p.id}, '${p.name}', ${p.price})">Sửa</button>
                <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" onclick="deleteProduct(${p.id})">Xóa</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (err) {
        showMessage('Lỗi tải danh sách sản phẩm', 'error');
      }
    }

    // HÀM TỰ TẠO — kiểm tra role và hiện nút Admin
    async function checkRole() {
      try {
        const testRes = await fetchWithAuth('/api/v1/products', {
          method: 'POST',
          body: JSON.stringify({ name: 'test', price: 0 })
        });
        if (testRes.status !== 403) {
          userRole = 'Admin';
          document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
          const testData = await testRes.json();
          if (testData.id) {
            await fetchWithAuth('/api/v1/products/' + testData.id, { method: 'DELETE' });
          }
        }
      } catch (err) {}
    }

    // HÀM TỰ TẠO — mở modal thêm
    function openModal() {
      document.getElementById('modalTitle').textContent = 'Thêm sản phẩm';
      document.getElementById('productId').value = '';
      document.getElementById('productName').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('modal').classList.remove('hidden');
    }

    // HÀM TỰ TẠO — mở modal sửa
    function editProduct(id, name, price) {
      document.getElementById('modalTitle').textContent = 'Sửa sản phẩm';
      document.getElementById('productId').value = id;
      document.getElementById('productName').value = name;
      document.getElementById('productPrice').value = price;
      document.getElementById('modal').classList.remove('hidden');
    }

    // HÀM TỰ TẠO — đóng modal
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    // HÀM TỰ TẠO — lưu sản phẩm (thêm hoặc sửa)
    async function saveProduct() {
      const id = document.getElementById('productId').value;
      const name = document.getElementById('productName').value;
      const price = Number(document.getElementById('productPrice').value);

      if (!name || !price) {
        showMessage('Vui lòng nhập đầy đủ', 'error');
        return;
      }

      try {
        let res;
        if (id) {
          res = await fetchWithAuth('/api/v1/products/' + id, {
            method: 'PUT',
            body: JSON.stringify({ name, price })
          });
        } else {
          res = await fetchWithAuth('/api/v1/products', {
            method: 'POST',
            body: JSON.stringify({ name, price })
          });
        }

        if (res.status === 403) {
          showMessage('Bạn không có quyền thực hiện chức năng này', 'error');
        } else if (res.ok) {
          showMessage(id ? 'Cập nhật thành công' : 'Thêm thành công', 'success');
          closeModal();
          loadProducts();
        }
      } catch (err) {
        showMessage('Lỗi kết nối server', 'error');
      }
    }

    // HÀM TỰ TẠO — xóa sản phẩm
    async function deleteProduct(id) {
      if (!confirm('Bạn có chắc muốn xóa?')) return;

      try {
        const res = await fetchWithAuth('/api/v1/products/' + id, { method: 'DELETE' });

        if (res.status === 403) {
          showMessage('Bạn không có quyền thực hiện chức năng này', 'error');
        } else if (res.ok) {
          showMessage('Xóa thành công', 'success');
          loadProducts();
        }
      } catch (err) {
        showMessage('Lỗi kết nối server', 'error');
      }
    }

    // HÀM TỰ TẠO — đăng xuất
    function logout() {
      sessionStorage.removeItem('token');
      window.location.href = '/login.html';
    }

    // Khởi chạy — chờ checkRole xong rồi mới loadProducts
    async function init() {
      await checkRole();
      await loadProducts();
    }
    init();
  </script>
</body>
</html>
