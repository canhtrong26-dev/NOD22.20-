<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-80">
    <h2 class="text-2xl font-bold text-center mb-6">Đăng nhập</h2>
    <p class="text-red-500 text-center mb-3 hidden" id="error"></p>
    <input type="email" id="email" placeholder="Email"
      class="w-full p-3 mb-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
    <input type="password" id="password" placeholder="Mật khẩu"
      class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
    <button onclick="login()"
      class="w-full p-3 bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold">
      Đăng nhập
    </button>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('token', data.token);
          window.location.href = '/index.html';
        } else {
          error.classList.remove('hidden');
          error.textContent = data.error || 'Đăng nhập thất bại';
        }
      } catch (err) {
        error.classList.remove('hidden');
        error.textContent = 'Lỗi kết nối server';
      }
    }
  </script>
</body>
</html>
